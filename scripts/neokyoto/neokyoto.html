function hipRoof(P, rise, over, ridge, d0 = 0.1) {
  const top = P.y0 + P.h;
  const hw = Math.abs(P.pts[0][0] - P.cx) + over, hd = Math.abs(P.pts[0][1] - P.cz) + over;
  const E = rectPts(P.cx, P.cz, hw, hd).map(([x, z]) => [x, top + 0.02, z]);
  const lift = (p) => [P.cx + (p[0] - P.cx) * 1.04, p[1] + 0.12, P.cz + (p[2] - P.cz) * 1.04];
  const Eu = E.map(lift);
  const along = hw > hd ? [1, 0] : [0, 1];
  const R0 = [P.cx - along[0] * ridge, top + rise, P.cz - along[1] * ridge], R1 = [P.cx + along[0] * ridge, top + rise, P.cz + along[1] * ridge];
  for (let k = 0; k < 4; k++) {

}

const hotAt = (d, sigma) => Math.exp(-(d * d) / (2 * sigma * sigma));
const beamLevel = (y) => toLin(lerp(0.95, 0.62, y / TIP));

function drawBeam(t) {
  beam.reset(); beamHid.reset(); beamHalo.reset();
  const top = t < T_RISE[1] ? riseY(t) : TIP;
  let py = null, drawing = false;
  if (t < T_RISE[1]) { py = top; drawing = true; }
  else if (t < T_DESC[1]) py = TIP * (1 - sine(span(t, T_DESC[0], T_DESC[1])));

  const level = (y) => {
    let v = beamLevel(y);
    if (py !== null) v += 2.0 * hotAt(y - py, drawing ? 0.14 : 0.3) * (drawing ? smooth(clamp((py - y) * 7 + 1)) : 1);
    return v;

  for (let i = 0; i < n; i++) {
    const y0 = (top * i) / n, y1 = (top * (i + 1)) / n;
    if (y1 <= y0) break;
    const a = [0, y0, 0], b = [0, y1, 0];
    beam.seg(a, b, ivory(level(y0)), ivory(level(y1)));
    beamHid.seg(a, b, ivory(0.3 * level(y0)), ivory(0.3 * level(y1)));
    beamHalo.seg(a, b, cool(0.014 * level(y0)), cool(0.014 * level(y1)));

  for (const s of [beam, beamHid, beamHalo]) s.commit();
  return py;
}

function drawHorizon(t) {

  if (ext > 0.001) {

    const core = (x) => toLin(0.72 * (1 - Math.abs(x) / HALF)) * (1 - 0.45 * Math.pow(Math.abs(x) / HALF, 1.5));
    const soft = (x) => toLin(0.72 * (1 - Math.abs(x) / HALF)) * 0.3 * Math.pow(Math.abs(x) / HALF, 1.2);
    for (let i = 0; i < n; i++) {
      const x0 = -reach + (2 * reach * i) / n, x1 = -reach + (2 * reach * (i + 1)) / n;
      horizon.seg([x0, 0, 0], [x1, 0, 0], ivory(core(x0)), ivory(core(x1)));

const fwd = new THREE.Vector3();
function depthCue(rot) {
  const ca = Math.cos(rot), sa = Math.sin(rot);
  cam.getWorldDirection(fwd);
  const cp = cam.position, tg = camState.tgt;
  const ref = (tg[0] - cp.x) * fwd.x + (tg[1] - cp.y) * fwd.y + (tg[2] - cp.z) * fwd.z;
  const sp = clamp(0.11 * ref, 2.2, 4.6);
  return (p) => {
    const x = p[0] * ca + p[2] * sa, z = -p[0] * sa + p[2] * ca;
    const d = (x - cp.x) * fwd.x + (p[1] - cp.y) * fwd.y + (z - cp.z) * fwd.z;
    return clamp((ref + sp - d) / (2 * sp));
  };
}

const edgeLevel = (n) => toLin(lerp(0.36, 0.9, n));
const fineLevel = (n) => toLin(lerp(0.34, 0.74, n));

function drawLibrary(t, s, near) {
  for (const st of [...visEdge, hidEdge, visFine, visHatch]) st.reset();
  for (const e of EDGES) {
    if (e.c0 >= s) break;
    const k = e.c1 <= s ? 1 : (s - e.c0) / (e.c1 - e.c0);
    const b = k < 1 ? mix(e.a, e.b, k) : e.b;
    const na = near(e.a), nb = near(b);
    const ha = HOT * Math.exp(-Math.max(0, t - e.tc) / TAIL), hb = k < 1 ? HOT : ha;
    const la = edgeLevel(na), lb = edgeLevel(nb), nm = (na + nb) / 2;
    visEdge[nm > 0.6 ? 0 : nm > 0.33 ? 1 : 2].seg(e.a, b, ivory(la + ha * (0.5 + 0.5 * na)), ivory(lb + hb * (0.5 + 0.5 * nb)));
    hidEdge.seg(e.a, b, ivory(HID * la + 0.35 * ha), ivory(HID * lb + 0.35 * hb));
  }
  for (const f of fills) {
    const k = (t - f.t0) / f.dur;
    if (k <= 0) continue;
    const kk = f.kind === "edge" ? 1 - Math.pow(1 - Math.min(1, k), 2) : smooth(Math.min(1, k));
    const b = kk < 1 ? mix(f.a, f.b, kk) : f.b;
    const na = near(f.a), nb = near(b), lift = 0.55 + 0.45 * kk;
    if (f.kind === "edge") {
      const la = edgeLevel(na) * lift, lb = edgeLevel(nb) * lift + (kk < 1 ? 0.7 * (1 - kk) : 0), nm = (na + nb) / 2;
      visEdge[nm > 0.6 ? 0 : nm > 0.33 ? 1 : 2].seg(f.a, b, ivory(la), ivory(lb));
      hidEdge.seg(f.a, b, ivory(HID * la), ivory(HID * lb));
    } else if (f.kind === "fine") visFine.seg(f.a, b, ivory(fineLevel(na) * lift), ivory(fineLevel(nb) * lift));
    else visHatch.seg(f.a, b, ivory(hatchLevel(na) * lift), ivory(hatchLevel(nb) * lift));
  }
  for (const st of [...visEdge, hidEdge, visFine, visHatch]) st.commit();
  for (const r of rooms) {

}

function signLevel(t) {
  const u = t - T_SIGN;

  const steps = [[0, 0.05, 0.9], [0.05, 0.13, 0.08], [0.13, 0.18, 0.75], [0.18, 0.34, 0.04], [0.34, 0.39, 0.95], [0.39, 0.47, 0.25]];

  return 0.25 + 0.75 * smooth(span(u, 0.47, 0.75)) * (0.97 + 0.03 * Math.sin(t * 29.0));

{

const v3 = new THREE.Vector3();
function project(p, rot) {
  const ca = Math.cos(rot), sa = Math.sin(rot);
  v3.set(p[0] * ca + p[2] * sa, p[1], -p[0] * sa + p[2] * ca).project(cam);
  return [((v3.x + 1) / 2) * W, ((1 - v3.y) / 2) * H];
}

function drawLabels(ctx, t, rot) {
  const out = 1 - smooth(span(t, 16.3, 17.1));
  const items = LABELS.map((L) => {
    const [ax, ay] = project(L.anchor, rot);
    return { L, ax, ay, ly: ay };
  });
  for (const side of [-1, 1]) {
    const col = items.filter((it) => it.L.side === side).sort((a, b) => a.ay - b.ay);
    for (let i = 0; i < col.length; i++) col[i].ly = Math.max(col[i].ay + 4, 34, i ? col[i - 1].ly + 46 : 0);
    for (let i = col.length - 1; i >= 0; i--) col[i].ly = Math.min(col[i].ly, i === col.length - 1 ? 392 : col[i + 1].ly - 46);
  }
  for (const it of items) {
    const { L, ax, ay, ly } = it;
    const k = smooth(span(t, L.t0, L.t0 + 0.4)) * out;
    if (k <= 0.001) continue;
    const a = smooth(span(t, L.t0 + 0.15, L.t0 + 0.7)) * out;
    const x = COL_X[L.side], ex = x - L.side * 10, ey = ly - 4;
    const reach = smooth(span(t, L.t0, L.t0 + 0.35));
    ctx.globalAlpha = 0.42 * k;
    ctx.strokeStyle = "#f2ede4";
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(lerp(ax, ex, reach), lerp(ay, ey, reach));
    ctx.stroke();
    ctx.globalAlpha = 0.85 * k;
    ctx.fillStyle = "#f6f1e7";
    ctx.beginPath();
    ctx.arc(ax, ay, 1.5, 0, Math.PI * 2);
    ctx.fill();
    if (a <= 0.001) continue;
    ctx.textAlign = L.side < 0 ? "right" : "left";
    ctx.textBaseline = "alphabetic";
    ctx.globalAlpha = 0.8 * a;
    ctx.fillStyle = "#f2ede4";
    ctx.font = LABEL_FONT;
    ctx.letterSpacing = "0.2px";
    ctx.fillText(L.name, x, ly + 1.5 * (1 - a));
    ctx.globalAlpha = 0.6 * a;
    ctx.font = DESC_FONT;
    ctx.letterSpacing = "0.1px";
    ctx.fillText(L.desc, x, ly + 15 + 1.5 * (1 - a));
  }
  ctx.globalAlpha = 1;
}

}

function flashAt(t) {

}

  document.fonts.load('500 29px "Geist"', NAME),
  document.fonts.load('300 15.5px "Geist"', LINE),
  document.fonts.load(LABEL_FONT, "personal-llm"),
  document.fonts.load(DESC_FONT, "the memory kernel"),
  document.fonts.load('500 150px "Noto Sans JP"', "記憶"),
]);
await document.fonts.ready;
measureType();
paintSign();
for (const s of [1.0, 4.0, 6.0, 9.0]) renderAt(s);
renderAt(0);
window.timeline = {
  weight: Math.round(C[C.length - 1]), chapters: CH.map((c) => [c.t0, c.t1, Math.round(C[c.n1] - C[c.n0])]), edges: EDGES.length, fills: fills.length, frame: FRAME,
  rooms: rooms.map((r) => [r.id, +r.tStart.toFixed(2), +r.tEnd.toFixed(2), +r.tDone.toFixed(2)]),
};
window.extent = (time) => {
  renderAt(time);
  const rot = libRot(time);
  let x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (const e of EDGES) for (const p of [e.a, e.b]) {
    const [x, y] = project(p, rot);
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  return [x0, x1, y0, y1].map(Math.round);
};
window.renderAt = renderAt;
window.ready = true;
</script>
