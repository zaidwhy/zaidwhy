name: Update profile telemetry

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run telemetry script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_telemetry.py

      - name: Test the plate generators (offline)
        id: plate_tests
        continue-on-error: true
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Redraw the core sample plate
        # Redraw only from code that passed its tests; a failed API call keeps yesterday's plate.
        # Neither may block the activity update above.
        if: steps.plate_tests.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/core_sample.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md assets/core-sample.svg; then
            echo "No changes to commit"
            exit 0
          fi
          git add README.md assets/core-sample.svg
          git commit -m "auto: update live activity and status"
          git push
