<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Architecture map: the personal-llm memory and RAG kernel, with 181 offline tests, is imported by second-brain (116 tests), github-pr-agent (84 tests) and DreamOS, rather than each rebuilding retrieval.">
<style>@font-face{font-family:'Geist Mono';font-weight:100 900;src:url(data:font/woff;base64,) format('woff')}</style>
