<defs>
<clipPath id="km-clip"><rect x="0" y="0" width="900" height="400" rx="10"/></clipPath>
<path id="km-p1" d="M310 204 C 430 204, 450 124, 570 124" fill="none"/>
<path id="km-p2" d="M310 204 H 570" fill="none"/>
<path id="km-p3" d="M310 204 C 430 204, 450 284, 570 284" fill="none"/>
</defs>

<g clip-path="url(#km-clip)">
<rect x="0" y="0" width="900" height="400" fill="#030303"/>

<text x="70" y="34" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.6">ONE KERNEL, IMPORTED</text>
<text x="70" y="55" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="11.5">Built once. Three apps import it instead of each rebuilding retrieval.</text>

<!-- connectors -->
<g stroke="#2a2a2a" stroke-width="1.6" fill="none">
<use href="#km-p1"/><use href="#km-p2"/><use href="#km-p3"/>
</g>

<!-- flow dots -->
<g fill="#f2f5ff">
<circle r="3.5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#km-p1"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#km-p2"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="2.8s" begin="1.8s" repeatCount="indefinite"><mpath href="#km-p3"/></animateMotion></circle>
</g>

<!-- kernel -->
<rect x="70" y="144" width="240" height="120" rx="10" fill="#0a0a0a" stroke="#f2f5ff" stroke-width="2"/>
<text x="90" y="176" fill="#f2f5ff" font-family="'Geist Mono', ui-monospace, monospace" font-size="15" font-weight="700">personal-llm</text>
<text x="90" y="197" fill="#a3a3a3" font-family="'Geist Mono', ui-monospace, monospace" font-size="11">memory + RAG kernel</text>
<text x="90" y="219" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5">SQLite + ChromaDB + router</text>
<text x="90" y="243" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="11.5" font-weight="700">181 offline tests</text>

<!-- consumers -->
<g>
<rect x="570" y="95" width="270" height="58" rx="8" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="1.5"/>
<text x="590" y="120" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="700">second-brain</text>
<text x="590" y="139" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5">vault ingestion, auto-linking  ·  116 tests</text>

<rect x="570" y="175" width="270" height="58" rx="8" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="1.5"/>
<text x="590" y="200" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="700">github-pr-agent</text>
<text x="590" y="219" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5">repo analysis, issue triage  ·  84 tests</text>

<rect x="570" y="255" width="270" height="58" rx="8" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="1.5"/>
<text x="590" y="280" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="700">DreamOS</text>
<text x="590" y="299" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5">AI command bar over the same engine</text>
</g>

<!-- finding -->
<text x="70" y="352" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="12.5">381 tests across the three, every one offline and mocked. No API key runs any of them.</text>

<!-- plate line -->
<rect x="0" y="376" width="900" height="24" fill="#000000"/>
<text x="70" y="392" fill="#4a4a4a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.2">PLATE 04  ·  ORIGINAL WORK OF ZAID ALI SYED  ·  ORCID 0009-0003-4313-1510  ·  MMXXVI</text>
