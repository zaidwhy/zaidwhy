<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 452" width="1280" height="452" role="img" aria-label="A terminal replaying real commands. Three pull requests show MERGED on 2026-08-05, 2026-08-04 and 2026-08-26. 27 pull requests merged at Zabira Academy. The three libraries total 13,493 stars. The last line reads: if any of this does not reproduce, the claim is wrong.">
