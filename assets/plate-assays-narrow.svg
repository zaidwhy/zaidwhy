<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1738" width="520" height="1738" role="img" aria-label="Plate III, assays. FLAKE LAUNDERING: with a correct test, coding agents weakened it in 0 of 60 runs; with a wrong test they repaired it in 9 of 10, 0 of 10 when told not to change the tests, 10 of 10 when told to find out which side is wrong. COLD READ: words before a model beats chance on gender: 50 for llama3.1 8B, 800 for qwen2.5 7B, about 1600 for mistral 7B. AUGUR: a 1938-cutoff model answers from 1899, a 1930-cutoff model from 1850.">
