<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="AUGUR results: two time-locked language models plotted on a timeline. TypeWriter-1938 has a 1938 cutoff but speaks from 1899, a 39 year gap, and refuses to relocate. Talkie-1930 has a 1930 cutoff but speaks from 1850, an 80 year gap, and relocates correctly when told the year.">
