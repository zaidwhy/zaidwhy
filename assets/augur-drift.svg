<defs>
<clipPath id="ag-clip"><rect x="0" y="0" width="900" height="450" rx="10"/></clipPath>
</defs>

<g clip-path="url(#ag-clip)">
<rect x="0" y="0" width="900" height="450" fill="#030303"/>

<!-- title -->
<text x="90" y="36" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.6">A CUTOFF IS A WALL, NOT AN ADDRESS</text>
<text x="90" y="57" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="11.5">Where two time-locked models actually answer from, against the date on the tin.</text>

<!-- ============ track 1: TypeWriter-1938 ============ -->
<text x="497.6" y="138" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="700">TypeWriter-1938<tspan fill="#5c5c5c" font-weight="400" font-size="10.5">   7.2B, Q8_0</tspan></text>

<rect x="497.6" y="150" width="269.5" height="14" rx="7" fill="#ff4f9a" opacity="0.28">
<animate attributeName="width" from="0" to="269.5" dur="1.2s" begin="0.3s" fill="freeze"/>
</rect>
<text x="632.4" y="161" fill="#ff4f9a" font-family="'Geist Mono', ui-monospace, monospace" font-size="11.5" font-weight="700" text-anchor="middle">39 years adrift</text>

<circle cx="497.6" cy="157" r="7.5" fill="#030303" stroke="#ff4f9a" stroke-width="2.5"/>
<path d="M767.1 143V171" stroke="#ff4f9a" stroke-width="2.5"/>

<text x="497.6" y="186" fill="#ff4f9a" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="700">1899</text>
<text x="767.1" y="186" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" text-anchor="end">1938 stated cutoff</text>
<text x="497.6" y="206" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5">Names George Washington as President.</text>
<text x="497.6" y="220" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5">Told the year, it will not move.</text>

<!-- ============ track 2: Talkie-1930 ============ -->
<text x="159.1" y="248" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" font-weight="700">Talkie-1930<tspan fill="#5c5c5c" font-weight="400" font-size="10.5">   13B, Q4_K_M</tspan></text>

<rect x="159.1" y="260" width="552.7" height="14" rx="7" fill="#f2f5ff" opacity="0.28">
<animate attributeName="width" from="0" to="552.7" dur="1.5s" begin="0.5s" fill="freeze"/>
</rect>
<text x="435.5" y="271" fill="#f2f5ff" font-family="'Geist Mono', ui-monospace, monospace" font-size="11.5" font-weight="700" text-anchor="middle">80 years adrift</text>

<circle cx="159.1" cy="267" r="7.5" fill="#030303" stroke="#f2f5ff" stroke-width="2.5"/>
<path d="M711.8 253V281" stroke="#f2f5ff" stroke-width="2.5"/>

<text x="159.1" y="296" fill="#f2f5ff" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="700">1850</text>
<text x="711.8" y="296" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" text-anchor="end">1930 stated cutoff</text>
<text x="159.1" y="316" fill="#8a8a8a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5">Names Bismarck and Grover Cleveland. Told the year, it jumps 80 years and gets Hoover right.</text>

<!-- ============ axis ============ -->
<path d="M90 350H850" stroke="#2a2a2a" stroke-width="1.5"/>
<g stroke="#2a2a2a" stroke-width="1">
<path d="M90 350V357M228.2 350V357M366.4 350V357M504.5 350V357M642.7 350V357M780.9 350V357"/>
</g>
<g fill="#5c5c5c" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" text-anchor="middle">
<text x="90" y="371">1840</text><text x="228.2" y="371">1860</text><text x="366.4" y="371">1880</text><text x="504.5" y="371">1900</text><text x="642.7" y="371">1920</text><text x="780.9" y="371">1940</text>
</g>

<!-- finding -->
<text x="90" y="405" fill="#fafafa" font-family="'Geist Mono', ui-monospace, monospace" font-size="12.5">The cutoff is the edge of the corpus. The model answers from its centre of gravity.</text>

<!-- plate line -->
<rect x="0" y="426" width="900" height="24" fill="#000000"/>
<text x="90" y="442" fill="#4a4a4a" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.2">PLATE 03  ·  AUGUR  ·  ORIGINAL RESEARCH OF ZAID ALI SYED  ·  doi 10.5281/zenodo.22309658</text>
</g>
